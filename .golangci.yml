version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - revive
    - gocyclo
    - nakedret
    - bodyclose
    - noctx
    - contextcheck
    - containedctx
    - fatcontext
    - depguard
    - forbidigo
    - gosec
  settings:
    gocyclo:
      min-complexity: 15
    revive:
      rules:
        - name: exported
          severity: warning
    depguard:
      rules:
        production:
          files:
            - '$all'
            - '!**/*_test.go'
          deny:
            - pkg: github.com/prometheus/client_golang
              desc: use the telemetry contract
            - pkg: log
              desc: use the telemetry contract logger
            - pkg: go.opentelemetry.io/otel/sdk
              desc: SDK is test-harness-only
            - pkg: github.com/guilhermelinosp/hellnet-lib-telemetry/telemetrytest
              desc: deprecated test package; use internal/obstest
    forbidigo:
      forbid:
        - pattern: 'slog.Debug'
        - pattern: 'slog.Info'
        - pattern: 'slog.Warn'
        - pattern: 'slog.Error'
        - pattern: 'slog.Default'
        - pattern: 'otel.Tracer'
        - pattern: 'otel.Meter'
        - pattern: 'otel.GetMeterProvider'
        - pattern: 'otel.GetTracerProvider'
        - pattern: 'otel.GetTextMapPropagator'
  exclusions:
    paths:
      - "_test\\.go$"
      - "^_examples/"
      - "internal/obstest/"
    rules:
      # TODO(telemetry-fase-D): remove after context-first cache paths land.
      - path: "cache/cache.go"
        linters: [containedctx, depguard]
      # TODO(telemetry-fase-D): remove after external provider receives caller context.
      - path: "cache/instrumentation.go"
        linters: [containedctx, contextcheck, depguard]
      # TODO(telemetry-fase-E): remove after coordination logs use instrument.Logger.
      - path: "cache/coordination.go"
        linters: [depguard]

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
