version: "2"

run:
  timeout: 5m
  tests: false

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: github.com/guilhermelinosp/hellnet-lib-cache

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - revive
    - gocyclo
    - nakedret
    - bodyclose
    - noctx
    - gosec
  settings:
    gocyclo:
      min-complexity: 15
    revive:
      rules:
        - name: exported
          severity: warning
  exclusions:
    rules:
      - path: "_test\\.go$"
        linters:
          - errcheck
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
