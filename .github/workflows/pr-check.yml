name: pr-check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  lint:
    uses: guilhermelinosp/templates/.github/workflows/shellcheck.yml@da82921830fafa7349cda3faef3310a3a4d86dda # main

  merge-check:
    uses: guilhermelinosp/templates/.github/workflows/merge-check.yml@da82921830fafa7349cda3faef3310a3a4d86dda # main

  gitleaks:
    uses: guilhermelinosp/templates/.github/workflows/gitleaks.yml@da82921830fafa7349cda3faef3310a3a4d86dda # main

  labeler:
    uses: guilhermelinosp/templates/.github/workflows/labeler.yml@da82921830fafa7349cda3faef3310a3a4d86dda # main

  quality:
    name: quality
    uses: guilhermelinosp/templates/.github/workflows/lib-quality.yml@da82921830fafa7349cda3faef3310a3a4d86dda # main
    with:
      go-version-file: go.mod
